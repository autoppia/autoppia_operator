name: Quality checks

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  lint-and-audit:
    name: Lint & complexity metrics
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "ruff>=0.10.0" radon

      - name: Fetch base branch
        run: |
          base_ref="${{ github.base_ref }}"
          if [ -n "$base_ref" ]; then
            git fetch origin "$base_ref" --depth=1
          else
            git fetch origin main --depth=1
          fi

      - name: Collect changed Python files
        id: changed-python
        run: |
          base_ref="${{ github.base_ref }}"
          if [ -n "$base_ref" ]; then
            base="origin/$base_ref"
          else
            base="origin/main"
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- '*.py')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "has_files=true"
            echo "files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Ruff check
        if: steps.changed-python.outputs.has_files == 'true'
        run: |
          printf '%s\n' "${{ steps.changed-python.outputs.files }}" > .changed-python.txt
          mapfile -t py_files < .changed-python.txt
          ruff check "${py_files[@]}"

      - name: Ruff format check
        if: steps.changed-python.outputs.has_files == 'true'
        run: |
          printf '%s\n' "${{ steps.changed-python.outputs.files }}" > .changed-python.txt
          mapfile -t py_files < .changed-python.txt
          ruff format --check "${py_files[@]}"

      - name: Ruff maintainability report
        if: steps.changed-python.outputs.has_files == 'true'
        run: |
          printf '%s\n' "${{ steps.changed-python.outputs.files }}" > .changed-python.txt
          mapfile -t py_files < .changed-python.txt
          ruff check "${py_files[@]}" --select C901,PLR0913,PLR0915 --output-format=concise
        continue-on-error: true

      - name: Radon cyclomatic complexity
        if: steps.changed-python.outputs.has_files == 'true'
        run: |
          printf '%s\n' "${{ steps.changed-python.outputs.files }}" > .changed-python.txt
          mapfile -t py_files < .changed-python.txt
          echo "=== Cyclomatic complexity (changed Python files) ==="
          radon cc "${py_files[@]}" -a -s --total-average 2>/dev/null || true

      - name: Radon maintainability index
        if: steps.changed-python.outputs.has_files == 'true'
        run: |
          printf '%s\n' "${{ steps.changed-python.outputs.files }}" > .changed-python.txt
          mapfile -t py_files < .changed-python.txt
          echo "=== Maintainability index (changed Python files) ==="
          radon mi "${py_files[@]}" -s 2>/dev/null || true

      - name: Radon complexity gate (fail on F)
        if: steps.changed-python.outputs.has_files == 'true'
        continue-on-error: true
        run: |
          printf '%s\n' "${{ steps.changed-python.outputs.files }}" > .changed-python.txt
          mapfile -t py_files < .changed-python.txt
          bad=$(radon cc "${py_files[@]}" -n F --no-assert 2>/dev/null | grep -c . || true)
          if [ "${bad:-0}" -gt 0 ]; then
            echo "::error::Cyclomatic complexity F (41+) detected in changed files."
            radon cc "${py_files[@]}" -n F --no-assert 2>/dev/null || true
            exit 1
          fi

      - name: Radon maintainability gate (fail on D/E)
        if: steps.changed-python.outputs.has_files == 'true'
        run: |
          printf '%s\n' "${{ steps.changed-python.outputs.files }}" > .changed-python.txt
          mapfile -t py_files < .changed-python.txt
          bad=$(radon mi "${py_files[@]}" -n D 2>/dev/null | grep -c . || true)
          if [ "${bad:-0}" -gt 0 ]; then
            echo "::error::Maintainability index D or E detected in changed files."
            radon mi "${py_files[@]}" -n D 2>/dev/null || true
            exit 1
          fi

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Fetch base branch
        run: |
          base_ref="${{ github.base_ref }}"
          if [ -n "$base_ref" ]; then
            git fetch origin "$base_ref" --depth=1
          else
            git fetch origin main --depth=1
          fi

      - name: Collect changed files
        id: changed-files
        run: |
          base_ref="${{ github.base_ref }}"
          if [ -n "$base_ref" ]; then
            base="origin/$base_ref"
          else
            base="origin/main"
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base"...HEAD)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "has_files=true"
            echo "files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run pre-commit
        if: steps.changed-files.outputs.has_files == 'true'
        run: |
          printf '%s\n' "${{ steps.changed-files.outputs.files }}" > .changed-files.txt
          mapfile -t files < .changed-files.txt
          pre-commit run --files "${files[@]}"
