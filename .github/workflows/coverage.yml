name: Test Coverage

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  coverage_check:
    runs-on: ubuntu-latest
    name: Run Tests & Coverage
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run pytest with coverage gating
        run: |
          pytest \
            --cov=src.operator.agents.fsm.candidates \
            --cov=src.operator.agents.fsm.state \
            --cov=training.models \
            --cov=training.s3_source \
            --cov-report=xml \
            --cov-fail-under=80 \
            tests/test_act_contract.py \
            tests/test_agent_core.py \
            tests/test_fsm_operator.py \
            tests/test_training_exporters.py \
            tests/test_training_iwap_module.py \
            tests/test_training_models_and_s3.py

      - name: Code Coverage Summary Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: always()
        with:
          filename: coverage.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '89 90'

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v3
        if: github.event_name == 'pull_request' && always()
        with:
          recreate: true
          path: code-coverage-results.md
